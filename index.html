<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Озвучення тексту туц</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f13; color: #e8e8f0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1a1a24; border: 1px solid #2e2e42;
    border-radius: 16px; padding: 28px;
    width: 100%; max-width: 640px;
    display: flex; flex-direction: column; gap: 16px;
  }
  h1 { font-size: 1.2rem; color: #a78bfa; font-weight: 600; }
  textarea {
    width: 100%; min-height: 180px;
    background: #12121a; border: 1px solid #2e2e42;
    border-radius: 10px; color: #e8e8f0;
    font-size: 1rem; padding: 14px; resize: vertical;
    outline: none; transition: border-color .2s; line-height: 1.6;
  }
  textarea:focus { border-color: #7c3aed; }
  textarea::placeholder { color: #555570; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .sel-wrap { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  label { font-size: 0.75rem; color: #888; }
  select {
    background: #12121a; border: 1px solid #2e2e42;
    border-radius: 8px; color: #e8e8f0;
    padding: 8px 10px; font-size: 0.9rem; outline: none; cursor: pointer;
  }
  .range-wrap { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  input[type=range] { accent-color: #7c3aed; width: 100%; cursor: pointer; }
  .buttons { display: flex; gap: 10px; }
  button {
    flex: 1; padding: 14px; border: none; border-radius: 10px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  button:active { transform: scale(.97); }
  #btnPlay { background: #7c3aed; color: #fff; }
  #btnStop { background: #c0392b; color: #fff; }
  button:hover { opacity: .85; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  progress { width: 100%; height: 6px; border-radius: 4px; accent-color: #7c3aed; }
  .status { font-size: 0.82rem; color: #666; text-align: center; min-height: 18px; }
  .status.active { color: #a78bfa; }
  .status.error { color: #e74c3c; }
</style>
</head>
<body>
<div class="card">
  <h1>🔊 Озвучення тексту</h1>
  <textarea id="txt" placeholder="Вставте або введіть текст тут…"></textarea>
  <div class="row">
    <div class="sel-wrap">
      <label>Голос</label>
      <select id="voice">
        <option value="nova">Nova (жіночий, м'який)</option>
        <option value="alloy">Alloy (нейтральний)</option>
        <option value="echo">Echo (чоловічий)</option>
        <option value="fable">Fable (виразний)</option>
        <option value="onyx">Onyx (глибокий)</option>
        <option value="shimmer">Shimmer (жіночий, чіткий)</option>
      </select>
    </div>
    <div class="range-wrap">
      <label>Швидкість: <span id="speedVal">1</span>x</label>
      <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1">
    </div>
  </div>
  <div class="buttons">
    <button id="btnPlay">▶ Читати</button>
    <button id="btnStop" disabled>■ Стоп</button>
  </div>
  <progress id="prog" value="0" max="100"></progress>
  <div class="status" id="status">Готовий до роботи</div>
</div>

<script>
const txt      = document.getElementById('txt');
const voiceSel = document.getElementById('voice');
const speedIn  = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const btnPlay  = document.getElementById('btnPlay');
const btnStop  = document.getElementById('btnStop');
const prog     = document.getElementById('prog');
const status   = document.getElementById('status');

speedIn.oninput = () => speedVal.textContent = speedIn.value;

let currentAudio = null;
let stopped = false;

txt.addEventListener('paste', () => setTimeout(() => { if (txt.value.trim()) speak(); }, 80));
btnPlay.onclick = speak;
btnStop.onclick = stop;

// Split into ~500 char chunks at sentence boundaries
function splitText(text) {
  const parts = text.match(/[^.!?…\n]+[.!?\n…]?/g) || [text];
  const res = []; let buf = '';
  for (const p of parts) {
    if ((buf + p).length > 500) { if (buf.trim()) res.push(buf.trim()); buf = p; }
    else buf += p;
  }
  if (buf.trim()) res.push(buf.trim());
  return res;
}

async function speak() {
  stop();
  const text = txt.value.trim();
  if (!text) { setStatus('Введіть текст!'); return; }

  stopped = false;
  btnPlay.disabled = true;
  btnStop.disabled = false;
  setStatus('Генерую аудіо…', 'active');

  const chunks = splitText(text);

  for (let i = 0; i < chunks.length; i++) {
    if (stopped) break;

    prog.value = Math.round((i / chunks.length) * 100);
    setStatus(`Частина ${i + 1} / ${chunks.length}…`, 'active');

    try {
      const audio = await puter.ai.txt2speech(chunks[i], {
        provider: 'openai',
        voice: voiceSel.value,
        speed: parseFloat(speedIn.value)
      });

      if (stopped) break;

      currentAudio = audio;
      audio.playbackRate = parseFloat(speedIn.value);

      await new Promise((resolve, reject) => {
        audio.onended = resolve;
        audio.onerror = reject;
        audio.play().catch(reject);
      });

    } catch (e) {
      if (stopped) break;
      setStatus('Помилка: ' + (e.message || e), 'error');
      break;
    }
  }

  if (!stopped) done();
}

function stop() {
  stopped = true;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = '';
    currentAudio = null;
  }
  prog.value = 0;
  btnPlay.disabled = false;
  btnStop.disabled = true;
  setStatus('Готовий до роботи');
}

function done() {
  currentAudio = null;
  prog.value = 100;
  btnPlay.disabled = false;
  btnStop.disabled = true;
  setStatus('Готово ✓');
}

function setStatus(msg, type) {
  status.textContent = msg;
  status.className = 'status' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
